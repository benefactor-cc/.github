name: platform-integrations

on:
  pull_request:
    paths:
      - architecture/platform-integrations.json
      - architecture/platform-integrations.schema.json
      - docs/PLATFORM_INTEGRATIONS.md
      - scripts/validate_platform_integrations.py
      - .github/workflows/platform-integrations.yml
  push:
    branches: [main]
    paths:
      - architecture/platform-integrations.json
      - architecture/platform-integrations.schema.json
      - docs/PLATFORM_INTEGRATIONS.md
      - scripts/validate_platform_integrations.py
      - .github/workflows/platform-integrations.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-integrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate platform integration policy
        run: python3 scripts/validate_platform_integrations.py .
